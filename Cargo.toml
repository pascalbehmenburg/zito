[package]
name = "zito"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "3"
crc32fast = "1"
eyre = "0.6"
fs2 = "0.4"
fxhash = "0.2"
memchr = "2"
regex = "1"
regex-syntax = "0.8"
rkyv = { version = "0.8", features = ["bytecheck", "std", "aligned", "pointer_width_32", "little_endian"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
walkdir = "2"

[dev-dependencies]
quickcheck = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
